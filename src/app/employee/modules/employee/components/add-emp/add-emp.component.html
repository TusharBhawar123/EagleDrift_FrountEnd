<div class="add-employee-form">
  <h2>Add Employee</h2>
  <form [formGroup]="employeeForm" (ngSubmit)="onSubmit()">
    <div class="form-row">
      <label for="fName">First Name:</label>
      <input type="text" id="fName" formControlName="fName" placeholder="Enter first name" required />
    </div>

    <div class="form-row">
      <label for="lName">Last Name:</label>
      <input type="text" id="lName" formControlName="lName" placeholder="Enter last name" required />
    </div>

    <div class="form-row">
      <label for="mName">Middle Name:</label>
      <input type="text" id="mName" formControlName="mName" placeholder="Enter middle name" />
    </div>

    <div class="form-row">
      <label for="gender">Gender:</label>
      <select id="gender" formControlName="gender" required>
        <option value="" disabled>Select gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="form-row">
      <label for="email">Email:</label>
      <input type="email" id="email" formControlName="email" placeholder="Enter email" required />
    </div>

    <div class="form-row">
      <label for="mobileNo">Mobile Number:</label>
      <input type="text" id="mobileNo" formControlName="mobileNo" placeholder="Enter mobile number" required />
    </div>

    <div class="form-row">
      <label for="empType">Employee Type:</label>
      <input type="text" id="empType" formControlName="empType" placeholder="Enter employee type" required />
    </div>

    <div class="form-row">
      <label for="dob">Date Of Birth:</label>
      <input type="date" id="dob" formControlName="dob" required />
    </div>

    <div class="form-row">
      <label for="doj">Date Of Joining:</label>
      <input type="date" id="doj" formControlName="doj" required />
    </div>

    <button type="submit" class="submit-btn" [disabled]="employeeForm.invalid">Submit</button>
  </form>
</div>
